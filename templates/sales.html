{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="../static/css/sales.css">
<link rel="stylesheet" href="//cdn.datatables.net/2.3.4/css/dataTables.dataTables.min.css">
{% endblock %}
{% block content %}
<header class="header">
    <h1>MyDuka Sales</h1>

    <div class="header-actions">
        <input type="text" placeholder="Search products..." class="search-bar" id="headerSearch">
        <button class="add-btn" type="button" data-bs-toggle="modal" data-bs-target="#exampleModal">+ Add
            Sales</button>
        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Sales Addition</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="/add_sales" method="post">
                            <!-- <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Sales ID</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Sales ID" name="sid">
                            </div> -->
                            <div class="mb-3">
                                <label for="pid">Select Product</label>
                                <select name="spid" id="pid">
                                    {% for productt in prods %}
                                    <option value="{{productt[0]}}">{{productt[1]}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Quantity</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Quantity" name="quantity">
                            </div>
                            <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                    </form>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Products Table Container -->
<div class="table-container">

    <table
        class="products-table table table-striped table-striped-columns table-hover table-bordered display dataTables"
        id="myTable">

        <thead>
            <tr>
                <th>Sales ID</th>
                <th>Product ID</th>
                <th>Quantity</th>
                <th>Created At</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>
            {%for sales in sale%}
            <tr>
                <td>{{sales[0]}}</td>
                <td>{{sales[1]}}</td>
                <td>{{sales[2]}}</td>
                <td>{{sales[3]}}</td>
                <td>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#editsales{{sales[0]}}">Edit
                    </button>
                    <div class="modal fade" id="editsales{{sales[0]}}" tabindex="-1" aria-labelledby="exampleModalLabel"
                        aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Sales</h1>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form action="/update_sale" method="post">
                                        <!-- <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Product ID</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Product ID " name="productid">
                            </div> -->
                                        <input type="hidden" name="id" value="{{sales[0]}}">
                                        <!-- <div class="mb-3">
                                                    <label for="pid">Select Product</label>
                                                    <select name="spid" id="pid" >
                                                        {% for productt in prods %}
                                                        <option value="{{productt[0]}}">{{productt[1]}}</option>
                                                        {% endfor %}
                                                    </select>
                                                </div> -->
                                        <div class="mb-3">
                                            <label for="formGroupExampleInput" class="form-label">Quantity</label>
                                            <input type="text" class="form-control" id="formGroupExampleInput"
                                                placeholder="Enter Quantity" name="quantity" value="{{sales[2]}}">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Add</button>
                                    </form>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>

                                </div>
                            </div>
                        </div>
                    </div>
                </td>
                <td>
                    <form action="/delete_products" method="post">
                    <button type="submit" class="btn btn-danger" name="del">
                        Delete
                    </button>
                </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
    integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="//cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>

<script>
    let table = new DataTable('#myTable');
</script>
<script>
    window.addEventListener("load", function () {

        // Remove the default DataTables search bar
        const searchBar = document.querySelector('.dataTables_filter');
        if (searchBar) {
            searchBar.remove();
        }

        // Connect your custom header search input
        // Make sure your input has id="headerSearch"
        const table = document.querySelector('table'); // replace with your table ID if needed
        if (table && $.fn.DataTable.isDataTable(table)) {
            const dataTable = $(table).DataTable();
            const headerSearch = document.querySelector('#headerSearch');
            if (headerSearch) {
                headerSearch.addEventListener('keyup', function () {
                    dataTable.search(this.value).draw();
                });
            }
        }

    });
</script>
{% endblock %}

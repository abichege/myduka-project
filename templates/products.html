                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <a href="" class="icon py-1"><i class="fa-solid fa-table-columns fa-beat-fade fa-2xl"
                            style="color: #57595c;"></i></a>
                    <li class="nav-item px-2">
                        <a class="nav-link " href="/dashboard">DashBoard</a>
                    </li>
                    <a href="" class="icon py-1"><i class="fa-solid fa-house fa-beat-fade fa-2xl"
                            style="color: #545a64;"></i></a>
                    <li class="nav-item px-2">
                        <a class="nav-link " href="/">Home</a>
                    </li>
                    <a href="" class="icon py-1"><i class="fa-solid fa-basket-shopping fa-beat-fade fa-2xl" style="color: #434851;"></i></a>

                    </li>
                    <a href=""></a>

                    </li>

                        <a class="nav-link " href="/login"><button class="l">LOGIN</button></a>

                </ul>
            </div>
        </div>
    </nav>
    <div style="background-color: rgb(115, 130, 214);padding-top: 80px;;">
        <h1 style="margin-left: 500px;">Products Page</h1>
        <div class="img-fluid">

        </div>
        <!-- <p>{{product}}</p> -->
        <!-- Button trigger modal -->
        <button style="margin-left: 500px;margin-top: 30px;margin-bottom: 30px;" type="button" class="btn btn-warning"
            data-bs-toggle="modal" data-bs-target="#exampleModal">
            Insert Products
        </button>

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="/add_products" method="post">
                            <!-- <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Product ID</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Product ID " name="productid">
                            </div> -->
                            <div class="mb-3">
                                <label for="formGroupExampleInput2" class="form-label">Name</label>
                                <input type="text" class="form-control" id="formGroupExampleInput2"
                                    placeholder="Name of Product" name="name">
                            </div>
                            <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Buying Price</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Buying Price" name="bp">
                            </div>
                            <div class="mb-3">
                                <label for="formGroupExampleInput2" class="form-label">Selling Price</label>
                                <input type="text" class="form-control" id="formGroupExampleInput2"
                                    placeholder="Enter Selling Prices" name="sp">
                            </div>
                            <button type="submit" class="btn btn-primary">Add</button>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

                    </div>
                </div>
            </div>
        </div>
        <div>
            <table class="table table-striped table-striped-columns table-hover table-bordered display" id="myTable">
                <!-- <caption>PRODUCTS</caption> -->
                <thead style="background-color: rgb(236, 167, 16);">
                    <tr>
                        <th>Product ID</th>
                        <th>Name</th>
                        <th>Buying Price</th>
                        <th>Selling Price</th>
                    </tr>
                </thead>
                <tbody>
                    {%for prods in product%}
                    <tr>
                        <td>{{prods[0]}}</td>
                        <td>{{prods[1]}}</td>
                        <td>{{prods[2]}}</td>
                        <td>{{prods[3]}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="

        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"

        crossorigin="anonymous"></script>
    <script>
        let table = new DataTable('#myTable');
    </script>
</body>

</html>

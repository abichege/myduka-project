{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="../static//css/products.css">
<link rel="stylesheet" href="//cdn.datatables.net/2.3.4/css/dataTables.dataTables.min.css">
{% endblock %}
{% block content %}
<header class="header">
    <h1>MyDuka Products</h1>

    <div class="header-actions">
        <input type="text" placeholder="Search products..." class="search-bar" id="headerSearch">
        <button class="add-btn" type="button" data-bs-toggle="modal" data-bs-target="#exampleModal">+ Add
            Product</button>
        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Product Addition</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="/add_products" method="post">
                            <!-- <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Product ID</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Product ID " name="productid">
                            </div> -->
                            <div class="mb-3">
                                <label for="formGroupExampleInput2" class="form-label">Name</label>
                                <input type="text" class="form-control" id="formGroupExampleInput2"
                                    placeholder="Name of Product" name="name">
                            </div>
                            <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Buying Price</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Buying Price" name="bp">
                            </div>
                            <div class="mb-3">
                                <label for="formGroupExampleInput2" class="form-label">Selling Price</label>
                                <input type="text" class="form-control" id="formGroupExampleInput2"
                                    placeholder="Enter Selling Prices" name="sp">
                            </div>
                            <button type="submit" class="btn btn-primary">Add</button>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Products Table Container -->
<div class="table-container">

    <table
        class="products-table table table-striped table-striped-columns table-hover table-bordered display dataTables"
        id="myTable">

        <thead>
            <tr>
                <th>Product ID</th>
                <th>Name</th>
                <th>Buying Price</th>
                <th>Selling Price</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>
            {%for prods in product%}
            <tr>
                <td>{{prods[0]}}</td>
                <td>{{prods[1]}}</td>
                <td>{{prods[2]}}</td>
                <td>{{prods[3]}}</td>
                <td><button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#editproduct{{prods[0]}}">
                        Edit
                    </button>
                    <div class="modal fade" id="editproduct{{prods[0]}}" tabindex="-1"
                        aria-labelledby="exampleModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Product</h1>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form action="/update_product" method="post">
                                        <!-- <div class="mb-3">
                                <label for="formGroupExampleInput" class="form-label">Product ID</label>
                                <input type="text" class="form-control" id="formGroupExampleInput"
                                    placeholder="Enter Product ID " name="productid">
                            </div> -->
                                        <input type="hidden" name="id" value="{{prods[0]}}">
                                        <div class="mb-3">
                                            <label for="formGroupExampleInput2" class="form-label">Name</label>
                                            <input type="text" class="form-control" id="formGroupExampleInput2"
                                                placeholder="Name of Product" name="name" value="{{prods[1]}}">
                                        </div>
                                        <div class="mb-3">
                                            <label for="formGroupExampleInput" class="form-label">Buying
                                                Price</label>
                                            <input type="text" class="form-control" id="formGroupExampleInput"
                                                placeholder="Enter Buying Price" name="bp" value="{{prods[2]}}">
                                        </div>
                                        <div class="mb-3">
                                            <label for="formGroupExampleInput2" class="form-label">Selling
                                                Price</label>
                                            <input type="text" class="form-control" id="formGroupExampleInput2"
                                                placeholder="Enter Selling Prices" name="sp" value="{{prods[3]}}">
                                        </div>
                                        <button type="submit" class="btn btn-primary">Add</button>
                                    </form>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Close</button>

                                </div>
                            </div>
                        </div>
                    </div>
                </td>
                <td>
                    <form action="/delete_products" method="post">
                    <button type="submit" class="btn btn-danger" name="del">
                        Delete
                    </button>
                </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
    integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="//cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>

<script>
    let table = new DataTable('#myTable');
</script>
<script>
window.addEventListener("load", function () {

    // Remove the default DataTables search bar
    const searchBar = document.querySelector('.dataTables_filter');
    if (searchBar) {
        searchBar.remove();
    }

    // Connect your custom header search input
    // Make sure your input has id="headerSearch"
    const table = document.querySelector('table'); // replace with your table ID if needed
    if (table && $.fn.DataTable.isDataTable(table)) {
        const dataTable = $(table).DataTable();
        const headerSearch = document.querySelector('#headerSearch');
        if (headerSearch) {
            headerSearch.addEventListener('keyup', function () {
                dataTable.search(this.value).draw();
            });
        }
    }

});
</script>
{% endblock %}
